<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부모님 혈당 & 인슐린 기록장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Realtime Database CDN (Compat 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- 타이틀 -->
        <header class="text-center mb-6 pt-4">
            <h1 class="text-2xl font-bold text-blue-600">🩺 부모님 혈당 & 인슐린 관리</h1>
            <p class="text-xs text-slate-500 mt-1">퇴원교육지 기준 자동 계산 및 실시간 공유</p>
        </header>

        <!-- 입력 카드 -->
        <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-slate-100">
            <h2 class="text-lg font-semibold mb-4 text-slate-700 flex items-center">
                <span class="bg-blue-100 text-blue-600 text-sm px-2 py-0.5 rounded mr-2">입력</span> 당뇨수치 기록하기
            </h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">📅 날짜 선택</label>
                <input type="date" id="recordDate" class="w-full p-3 border border-slate-300 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">아침 식전 혈당</label>
                    <input type="number" id="amBefore" placeholder="예: 150" class="w-full p-3 border border-slate-300 rounded-xl text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">점심 식전 혈당</label>
                    <input type="number" id="lunchBefore" placeholder="예: 270" class="w-full p-3 border border-slate-300 rounded-xl text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">저녁 식전 혈당</label>
                    <input type="number" id="pmBefore" placeholder="예: 135" class="w-full p-3 border border-slate-300 rounded-xl text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">전날 투제오 기준 (아침)</label>
                    <input type="number" id="baseToujeo" value="12" class="w-full p-3 border border-slate-300 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <button onclick="calculateAndSave()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-blue-700 active:scale-95 transition text-lg">
                인슐린 용량 계산 및 저장하기
            </button>
        </div>

        <!-- 결과 확인 카드 -->
        <div id="resultCard" class="bg-blue-50 rounded-2xl border border-blue-200 p-5 mb-6 hidden">
            <h2 class="text-lg font-bold text-blue-900 mb-3">💡 추천 투여 용량 결과</h2>
            <div class="space-y-2 text-blue-950 text-base">
                <p id="resToujeo" class="bg-white p-3 rounded-xl shadow-sm border border-blue-100"></p>
                <p id="resHumalog" class="bg-white p-3 rounded-xl shadow-sm border border-blue-100"></p>
            </div>
        </div>

        <!-- 최근 기록 리스트 (실시간 연동) -->
        <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-100">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">📋 실시간 혈당 관리표</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
                            <th class="p-2.5">날짜</th>
                            <th class="p-2.5">아침(식전)</th>
                            <th class="p-2.5">점심(식전)</th>
                            <th class="p-2.5">저녁(식전)</th>
                            <th class="p-2.5">추천 인슐린</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody">
                        <tr><td colspan="5" class="text-center p-4 text-slate-400">데이터를 불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // TODO: 본인의 Firebase 설정값으로 아래를 교체하세요!
        const firebaseConfig = {
          apiKey: "AIzaSyCyVibhpODmcPxfoRHKJC9ZhY0ODGsNIJo",
          authDomain: "insulin-trackerfordaddy.firebaseapp.com",
          databaseURL: "https://insulin-trackerfordaddy-default-rtdb.firebaseio.com",
          projectId: "insulin-trackerfordaddy",
          storageBucket: "insulin-trackerfordaddy.firebasestorage.app",
          messagingSenderId: "377348468107",
          appId: "1:377348468107:web:d159535a4e2b6eb0c7538e",
          measurementId: "G-TDZY49Z7R4"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 오늘 날짜 기본 세팅
        document.getElementById('recordDate').valueAsDate = new Date();

        // 데이터 실시간 동기화 리스너 (부모님이 입력하든 자녀가 보든 실시간 반영)
        db.ref('insulin_records').on('value', (snapshot) => {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-slate-400">저장된 기록이 없습니다.</td></tr>`;
                return;
            }

            // 날짜 최신순 정렬
            const keys = Object.keys(data).sort().reverse();
            keys.forEach(key => {
                const item = data[key];
                const row = document.createElement('tr');
                row.className = "border-b border-slate-100 hover:bg-slate-50";
                row.innerHTML = `
                    <td class="p-2.5 font-medium text-slate-700">${item.date}</td>
                    <td class="p-2.5">${item.amBefore || '-'}</td>
                    <td class="p-2.5">${item.lunchBefore || '-'}</td>
                    <td class="p-2.5">${item.pmBefore || '-'}</td>
                    <td class="p-2.5 text-xs text-slate-600">${item.summary || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        });

        function calculateAndSave() {
            const date = document.getElementById('recordDate').value;
            const amBefore = parseFloat(document.getElementById('amBefore').value) || 0;
            const lunchBefore = parseFloat(document.getElementById('lunchBefore').value) || 0;
            const pmBefore = parseFloat(document.getElementById('pmBefore').value) || 0;
            const baseToujeo = parseFloat(document.getElementById('baseToujeo').value) || 12;

            if (!date) {
                alert('날짜를 선택해주세요.');
                return;
            }

            // 1. 투제오 계산 (아침 공복혈당 기준)
            let toujeoResult = "";
            let newToujeo = baseToujeo;
            if (amBefore > 0) {
                if (amBefore < 100) {
                    newToujeo = baseToujeo - 2;
                    toujeoResult = `⚪ 투제오 (백색): 공복혈당 ${amBefore} (100 미만) ➔ **${newToujeo}단지 감량** (${baseToujeo} → ${newToujeo})`;
                } else if (amBefore <= 150) {
                    toujeoResult = `⚪ 투제오 (백색): 공복혈당 ${amBefore} (100~150) ➔ **유지 (${baseToujeo}단위)**`;
                } else {
                    newToujeo = baseToujeo + 2;
                    toujeoResult = `⚪ 투제오 (백색): 공복혈당 ${amBefore} (150 초과) ➔ **${newToujeo}단위 증량** (${baseToujeo} → ${newToujeo})`;
                }
            } else {
                toujeoResult = `⚪ 투제오: 아침 공복혈당 미입력`;
            }

            // 2. 휴마로그 계산 (아침, 점심, 저녁 식전)
            function getHumalogAction(val, mealName) {
                if (val <= 0) return `${mealName}: 미입력`;
                if (val < 150) return `${mealName} 식전 ${val} (150 미만) ➔ **2단위 감량**`;
                if (val <= 200) return `${mealName} 식전 ${val} (150~200) ➔ **유지**`;
                return `${mealName} 식전 ${val} (200 이상) ➔ **2단위 증량**`;
            }

            const humalogAm = getHumalogAction(amBefore, '아침 휴마로그');
            const humalogLunch = getHumalogAction(lunchBefore, '점심 휴마로그');
            const humalogPm = getHumalogAction(pmBefore, '저녁 휴마로그');

            // 결과 화면 표시
            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('resToujeo').innerHTML = toujeoResult;
            document.getElementById('resHumalog').innerHTML = `⚫ 휴마로그 (검은색):<br>• ${humalogAm}<br>• ${humalogLunch}<br>• ${humalogPm}`;

            // Firebase에 데이터 저장 (날짜를 고유 키로 사용 예: 2026-11-01)
            const dateKey = date.replace(/-/g, '_');
            const summaryText = `투제오:${newToujeo}U / 아침:${amBefore} 점심:${lunchBefore} 저녁:${pmBefore}`;

            db.ref('insulin_records/' + dateKey).set({
                date: date,
                amBefore: amBefore,
                lunchBefore: lunchBefore,
                pmBefore: pmBefore,
                summary: summaryText
            }, (error) => {
                if (error) {
                    alert('저장 중 오류가 발생했습니다.');
                } else {
                    // 저장 성공 시 부드럽게 결과로 스크롤
                    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
                }
            });
        }
    </script>
</body>
</html>
